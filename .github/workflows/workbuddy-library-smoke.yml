name: WorkBuddy library Product-only diagnostic
on:
  push:
    paths:
      - 'code/tools/official_workbuddy_library.py'
      - 'code/tools/workbuddy_library_driver.mjs'
      - 'code/tests/test_official_workbuddy_library.py'
      - 'code/tests/fakes/workbuddy_library_driver_test.mjs'
      - '.github/workflows/workbuddy-library-smoke.yml'
permissions:
  contents: read
jobs:
  library:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.17'
      - name: Offline fixtures and actual Windows lifecycle prerequisite
        shell: pwsh
        working-directory: code
        env:
          PYTHONPATH: src
        run: |
          node --check tools/workbuddy_library_driver.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/fakes/workbuddy_library_driver_test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exactly one external-account WorkBuddy Product read and close
        shell: pwsh
        env:
          PYTHONPATH: code/src
        run: |
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip/7z.exe'
          if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) { throw 'RUNNER_7ZIP_MISSING' }
          $runRoot = Join-Path $env:RUNNER_TEMP 'native-harness-library-product-once'
          $summary = Join-Path $env:GITHUB_WORKSPACE 'library-product-sanitized-summary.json'
          python code/tools/official_workbuddy_library.py --seven-zip "$sevenZip" --run-root "$runRoot" --summary "$summary"
          exit $LASTEXITCODE
      - name: Sanitized own summary only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: library-product-sanitized-summary
          path: library-product-sanitized-summary.json
          if-no-files-found: warn
          retention-days: 7
